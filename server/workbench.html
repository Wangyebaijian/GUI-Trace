<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Atlas / 本机时序实验工作台</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#eef1f7;color:#202941;font:14px -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}button,input,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:8px;padding:10px 15px;background:#4b4df2;color:white}button:hover{filter:brightness(1.12)}.quiet{background:#eef0ff;color:#4b4df2}.danger{background:#fff0ef;color:#cc4b55}.shell{display:grid;grid-template-columns:200px 1fr;min-height:100vh}aside{background:#171c32;color:#c4cbe0;padding:30px 22px}.brand{font-size:23px;color:white;font-weight:800;letter-spacing:4px}.nav{padding:15px;margin-top:10px;border-radius:9px}.nav.active{background:#373767;color:white}.nav:first-of-type{margin-top:50px}main{padding:26px 34px;min-width:0}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:25px}.eyebrow{font-size:11px;letter-spacing:2px;color:#8b93ac}h1{font-size:28px;letter-spacing:-1px;margin:6px 0}h2{font-size:17px;margin:0}h3{font-size:14px;margin:0 0 10px}.badge{background:#dcf4e8;color:#277757;border-radius:50px;padding:7px 13px;font-size:12px}.grid{display:grid;grid-template-columns:1.5fr 1fr;gap:20px}.card{background:white;border:1px solid #dce1ec;border-radius:15px;padding:23px;box-shadow:0 3px 7px #15244904}.cardhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}.sub{color:#8b93a8;font-size:12px}.stats{display:grid;grid-template-columns:1fr 1fr;gap:14px}.stat{padding:16px;background:#f5f6fb;border-radius:9px}.label{font-size:11px;color:#8a92a8;margin-bottom:8px}.value{font-size:20px;font-weight:650}.note{background:#fff9e9;border:1px solid #f3e0b2;padding:15px;line-height:1.7;border-radius:9px;margin:12px 0}.message{border-left:3px solid #7366ff;padding:12px;background:#f2efff;line-height:1.8;margin:12px 0}.stack{display:grid;gap:18px}.row{display:flex;align-items:center;justify-content:space-between;gap:15px;padding:13px 0;border-bottom:1px solid #eff1f6}.row:last-child{border:0}.mono{font-family:ui-monospace,monospace}.empty{color:#a4adbd;line-height:1.8;padding:15px 0}.actions{display:flex;gap:9px;flex-wrap:wrap}.timeline{padding-left:18px;border-left:2px solid #e2e5ef;color:#6e7890;font-size:12px;line-height:2.2}.modal{position:fixed;inset:0;background:#11182a80;display:none;align-items:center;justify-content:center;backdrop-filter:blur(4px)}.modal.open{display:flex}.dialog{background:white;padding:30px;border-radius:18px;width:520px;box-shadow:0 30px 100px #171c3240}label{display:block;font-size:12px;color:#69738c;margin:14px 0 7px}input,textarea{width:100%;padding:12px;border:1px solid #d8ddea;border-radius:8px;background:#fafbff;color:#202941}textarea{height:85px;resize:none}.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}.dialog .actions{margin-top:22px;justify-content:flex-end}.toast{position:fixed;bottom:25px;left:50%;transform:translateX(-50%);background:#252d49;color:white;padding:12px 22px;border-radius:10px;opacity:0;transition:.2s}.toast.show{opacity:1}.small{font-size:11px}.foot{margin-top:18px;display:flex;justify-content:space-between;color:#929bb0;font-size:11px}.dot{width:7px;height:7px;border-radius:50%;background:#50ba91;display:inline-block;margin-right:6px}.summary{white-space:pre-wrap;line-height:1.9;font-size:13px}
</style>
<div class="shell"><aside><div class="brand">ATLAS<span style="color:#8d83ff">.</span></div><div class="sub" style="margin-top:8px">Temporal workspace</div><div class="nav active">◈ 发布计划</div><div class="nav">▤ 项目笔记</div><div class="nav">◷ 时间与提醒</div><div class="nav">◇ 本机实验</div><div style="margin-top:200px;font-size:11px;line-height:1.9;color:#747e9a">UI-TRACE-EFFECIENCY<br>受控本机 GUI 任务<br><span class="dot"></span>仅在本地浏览器运行</div></aside><main><header><div><div class="eyebrow">WORKSPACE / RELEASE OPERATIONS</div><h1 id="heading">准备一场跨时段发布会</h1></div><div class="badge" id="status">● 待规划</div></header><div class="grid"><div class="stack"><section class="card"><div class="cardhead"><div><h2>发布计划</h2><div class="sub" style="margin-top:6px">保留最新决策，正确处理早期约束</div></div><button id="edit-plan">创建计划</button></div><div class="stats" id="plan"></div></section><section class="card"><div class="cardhead"><h2>项目笔记</h2><button class="quiet" id="add-note">＋ 新建笔记</button></div><div id="notes"></div></section><section class="card"><div class="cardhead"><h2>最终摘要</h2><button class="quiet" id="generate">生成摘要</button></div><div id="summary" class="empty">完成时序修订后生成最终交付摘要。</div><button id="confirm" style="display:none;margin-top:15px">确认并归档</button></section></div><div class="stack"><section class="card"><div class="cardhead"><h2>协作消息</h2><span class="sub" id="message-counter">BRIEF / 01</span></div><div id="inbox"></div><div class="actions"><button class="quiet" id="notice-one">接收场地通知</button><button class="quiet" id="notice-two">接收最新通知</button></div></section><section class="card"><div class="cardhead"><h2>时间提醒</h2><button class="quiet" id="add-reminder">＋ 添加</button></div><div id="reminders"></div></section><section class="card"><h2>待办清单</h2><div class="row"><label style="margin:0"><input type="checkbox" id="check-kit" style="width:auto;margin-right:8px">准备展示设备</label></div><div class="row"><label style="margin:0"><input type="checkbox" id="check-access" style="width:auto;margin-right:8px">核验场地与恢复口令</label></div></section><section class="card"><h2 style="margin-bottom:12px">最近操作</h2><div class="timeline" id="audit"></div></section></div></div><div class="foot"><span>LOCAL SANDBOX · 数据仅属于此次实验</span><span id="revision">REV 000</span></div></main></div>
<div class="modal" id="plan-modal"><div class="dialog"><h2>编辑发布计划</h2><label>项目名称</label><input id="plan-title"><div class="fields"><div><label>日期</label><input id="plan-date" type="date"></div><div><label>时间</label><input id="plan-time" type="time"></div></div><label>场地</label><input id="plan-location"><label>预算 / 元</label><input id="plan-budget" type="number"><div class="actions"><button class="quiet" data-close>取消</button><button id="save-plan">保存计划</button></div></div></div>
<div class="modal" id="note-modal"><div class="dialog"><h2>新增项目笔记</h2><label>标题</label><input id="note-title"><label>内容</label><textarea id="note-body"></textarea><div class="actions"><button class="quiet" data-close>取消</button><button id="save-note">保存笔记</button></div></div></div>
<div class="modal" id="reminder-modal"><div class="dialog"><h2>设置提醒</h2><label>提醒标题</label><input id="reminder-title"><label>提醒时间</label><input id="reminder-time" type="datetime-local"><div class="actions"><button class="quiet" data-close>取消</button><button id="save-reminder">保存提醒</button></div></div></div><div class="toast" id="toast"></div>
<script>
const $=s=>document.querySelector(s), esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const seed=new URLSearchParams(location.search).get('seed')||'DEMO';
const code='AURORA-'+seed.slice(-4).toUpperCase();
let state={plan:{title:'',date:'',time:'',location:'',budget:0},notes:[],reminders:[],revision:0,notice:0,audit:[],summary:'',archived:false,kit:false,access:false};
const initial='原始委托：曙光发布会，2026-11-18 09:30，演示室 A，预算 6800 元。供应商恢复口令 '+code+'。后续预算可临时调整，但交付前必须恢复原始预算与口令。';
function toast(t){$('#toast').textContent=t;$('#toast').classList.add('show');setTimeout(()=>$('#toast').classList.remove('show'),1500)}
function update(t){state.revision++;state.audit.push(t);render();toast(t)}
function render(){const p=state.plan;$('#heading').textContent=p.title||'准备一场跨时段发布会';$('#status').textContent=state.archived?'● 已归档':p.title?'● 规划进行中':'● 待规划';$('#edit-plan').textContent=p.title?'编辑计划':'创建计划';$('#plan').innerHTML=[['活动日期',p.date||'尚未确定'],['活动时间',p.time||'—'],['活动场地',p.location||'—'],['项目预算',p.budget?'¥ '+p.budget.toLocaleString():'—']].map(([a,b])=>'<div class="stat"><div class="label">'+a+'</div><div class="value">'+esc(b)+'</div></div>').join('');$('#notes').innerHTML=state.notes.length?state.notes.map(n=>'<div class="note"><div class="cardhead" style="margin-bottom:6px"><b>'+esc(n.title)+'</b><button class="danger small" data-delete-note="'+n.id+'">删除</button></div>'+esc(n.body)+'</div>').join(''):'<div class="empty">还没有笔记。保存最初的约束，记录每次重要修订。</div>';$('#reminders').innerHTML=state.reminders.length?state.reminders.map(n=>'<div class="row"><div><b>'+esc(n.title)+'</b><div class="sub mono" style="margin-top:6px">'+esc(n.time.replace('T',' '))+'</div></div><button class="danger small" data-delete-reminder="'+n.id+'">撤销</button></div>').join(''):'<div class="empty">尚未设置提醒。</div>';$('#inbox').innerHTML='<div class="message">'+esc(state.notice===0?initial:state.notice===1?'通知 1：11 月 18 日演示室 A 不可用。活动改为 11 月 19 日 14:00，演示室 B。提醒必须提前 24 小时。预算暂调为 5200 元，删除过期的原始笔记。':'通知 2：11 月 18 日演示室 B 已释放。恢复原活动日期，但保留最新的 14:00 与演示室 B。撤销旧提醒，重新提前 24 小时提醒。最终预算与口令仍遵循最初的委托。')+'</div>';$('#message-counter').textContent='BRIEF / 0'+(state.notice+1);$('#audit').innerHTML=state.audit.slice(-4).map(t=>'<div>'+esc(t)+'</div>').join('')||'等待首次操作';$('#revision').textContent='REV '+String(state.revision).padStart(3,'0');$('#summary').textContent=state.summary||'完成时序修订后生成最终交付摘要。';$('#summary').className=state.summary?'summary':'empty';$('#confirm').style.display=state.summary?'':'none'}
function close(){document.querySelectorAll('.modal').forEach(e=>e.classList.remove('open'))}
document.querySelectorAll('[data-close]').forEach(e=>e.onclick=close);
$('#edit-plan').onclick=()=>{for(const k of ['title','date','time','location','budget'])$('#plan-'+k).value=state.plan[k];$('#plan-modal').classList.add('open')};
$('#save-plan').onclick=()=>{for(const k of ['title','date','time','location','budget'])state.plan[k]=k==='budget'?Number($('#plan-'+k).value):$('#plan-'+k).value;close();update('已保存计划修订')};
$('#add-note').onclick=()=>{$('#note-title').value='';$('#note-body').value='';$('#note-modal').classList.add('open')};
$('#save-note').onclick=()=>{state.notes.push({id:Date.now().toString(),title:$('#note-title').value,body:$('#note-body').value});close();update('已添加笔记：'+$('#note-title').value)};
$('#add-reminder').onclick=()=>{$('#reminder-title').value='';$('#reminder-time').value='';$('#reminder-modal').classList.add('open')};
$('#save-reminder').onclick=()=>{state.reminders.push({id:Date.now().toString(),title:$('#reminder-title').value,time:$('#reminder-time').value});close();update('已创建时间提醒')};
document.addEventListener('click',e=>{const n=e.target.dataset.deleteNote,r=e.target.dataset.deleteReminder;if(n){state.notes=state.notes.filter(x=>x.id!==n);update('已删除过期笔记')}if(r){state.reminders=state.reminders.filter(x=>x.id!==r);update('已撤销过期提醒')}});
$('#notice-one').onclick=()=>{state.notice=1;update('收到第一次场地冲突通知')};$('#notice-two').onclick=()=>{state.notice=2;update('收到第二次日期修订通知')};
$('#check-kit').onchange=e=>{state.kit=e.target.checked;update('已准备展示设备')};$('#check-access').onchange=e=>{state.access=e.target.checked;update('已核验场地与恢复口令')};
$('#generate').onclick=()=>{const p=state.plan;state.summary=p.title+'\n活动：'+p.date+' '+p.time+' · '+p.location+'\n最终预算：'+p.budget+' 元\n提醒：'+state.reminders.map(r=>r.time.replace('T',' ')).join('、')+'\n恢复记录：'+(state.notes.find(n=>n.title==='恢复凭证')?.body||'尚未恢复')+'\n交付：设备'+(state.kit?'已准备':'待准备')+' / 场地'+(state.access?'已核验':'待核验');update('已生成最终交付摘要')};$('#confirm').onclick=()=>{state.archived=true;update('已确认并归档最终方案')};
window.getTaskState=()=>structuredClone(state);render();
</script></html>
